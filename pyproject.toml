[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-hydradb"
version = "0.1.0"
description = "HydraDB external-memory storage for CrewAI agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "HydraDB", email = "support@hydradb.com" }]
keywords = ["hydradb", "crewai", "memory", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
crewai = ["crewai>=1.0,<1.11"]
test = ["pytest>=7", "responses>=0.24"]

[project.urls]
Homepage = "https://hydradb.com"
Documentation = "https://docs.hydradb.com/"
Repository = "https://github.com/hydra-db/hydradb-crewai"

[tool.hatch.build.targets.wheel]
packages = ["hydradb_crewai"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
